# ============================================================
# STEP 1: Your Identity (required)
# ============================================================
name: "Huadong Zeng"
title: "Lecturer"
department: "College of Materials and New Energy"
college: ""
institution: "South China Normal University"
institution_location: "Shanwei, Guangdong, China"
email: ""  # 可填写你的电子邮箱，如需隐藏可留空
phone: ""  # 留空隐藏电话号码
office: "Room 826, Teacher's Comprehensive Building" # 可填写办公室位置，留空则默认使用 institution_location
photo: profile/ZHD.png  # 替换为你在 images/profile/ 目录下放置的个人头像文件名
share_image: profile/ZHD.png  # 社交媒体分享预览图文件名

# ============================================================
# STEP 2: Your Links (optional -- delete any you don't use)
# ============================================================
links:
  google_scholar: ""
  github: "https://github.com/homielouishere-create"
  researchgate: ""
  orcid: ""
  twitter: ""
  linkedin: ""
  cv: ""  # 会在构建时自动从 cv/cv.md 生成，留空可隐藏 CV 图标
  youtube: ""

# ============================================================
# STEP 3: Site Settings
# ============================================================
# Brand color for non-CSS assets only (favicon.svg), which can't read CSS
# variables. The site's actual accent colors are a four-rung scale
# (wash/soft/base/deep) with separate light and dark values — too much for one
# key — and live in _sass/base/_variables.scss. Keep this in sync with the
# --accent rung there.
accent_color: "#2196F3"
dark_mode: true              # 在导航栏显示深色模式切换开关
description: "Academic webpage of Zihao Wang"
baseurl: "/Dr.-Zeng-group"
url: "https://homielouishere-create.github.io"

# Google Analytics — 留空或填入你自己的 GA4 测量 ID
analytics:
  google_id: ""

# ============================================================
# STEP 4: Choose Your Pages (comment out any you don't need)
# ============================================================
nav_pages:
  - name: about
  - name: publications
  - name: talks
  - name: research
  - name: projects
  - name: lab
  - name: team
  - name: teaching
  - name: videos
  - name: blogs

# ============================================================
# Advanced Settings (you probably don't need to change these)
# ============================================================
include:
  - .htaccess
  - _pages

# Lab news — image-first posts about lab activity, shown on /lab/ and /lab/news/.
# Files live in _lab_news/ with NO date prefix (unlike _posts): outside of
# _posts, Jekyll does not strip a date from the filename, so a prefix would
# leak into the URL. Ordering comes from the `date:` field in front matter.
collections:
  lab_news:
    output: true
    permalink: /lab/news/:name/

defaults:
  - scope:
      path: ""
      type: "lab_news"
    values:
      layout: "lab_news"

sass:
  quiet_deps: true
  style: compressed

permalink: /blogs/:title/

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true

plugins: ["jekyll/scholar", "jekyll-sitemap"]

scholar:
  last_name: Wang
  first_name: [Zihao]
  style: citesty
  locale: en
  source: /assets/
  bibliography: ref.bib
  bibliography_template: bibtemplate
  sort_by: year, month
  order: descending
  replace_strings: true
  join_strings: true
  details_dir: bibliography
  details_layout: bibtex.html
  details_link: Details
  query: "@*"
  bibliography_list_attributes:
    reversed: "reversed"

exclude:
  - Gemfile
  - Gemfile.lock
  - update_bootstrap.sh
  - switch_theme.sh
  - tags
  - Rakefile
  - node_modules
  - cv          # CV markdown source; rendered to files/cv.pdf by CI
  - package.json
  - package-lock.json
  - docs