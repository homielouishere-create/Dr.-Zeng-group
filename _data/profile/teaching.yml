  textbooks: []
  projects: []

- code: "PHYS 101L"
  name: "College Physics Laboratory"
  semesters:
    - "Spring (Freshman)"
    - "Fall (Sophomore)"
  description: >
    This practical laboratory course complements College Physics by offering hands-on experience 
    with classical and modern physics experiments. Students receive systematic training in experimental 
    methods, error analysis, data processing, and scientific report writing across key areas including 
    mechanics, optics, and electromagnetism. (4 Credits)
