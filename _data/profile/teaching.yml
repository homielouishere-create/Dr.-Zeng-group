- code: "PHYS 101"
  name: "College Physics"
  semesters:
    - "Spring (Freshman)"
    - "Fall (Sophomore)"
  description: >
    This foundational course covers the core principles of classical and modern physics, 
    including mechanics, thermodynamics, electromagnetism, optics, and introductory quantum physics. 
    Designed for undergraduate students in science and engineering, the course emphasizes 
    physical concepts, mathematical modeling, and analytical problem-solving skills to build 
    a rigorous theoretical foundation for subsequent advanced courses. (4 Credits)
