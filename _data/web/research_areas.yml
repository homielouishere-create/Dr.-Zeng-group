# Research focus areas — rendered on the Lab page before Equipment.
# projects.slug must match the Jekyll slugify output of the project title in research.yml

research_areas:
  - id: "01"
    name: "2D Battery Materials & Molecular Design"
    image: "research/battery_materials.png"
    description: "Atomic-scale design, electronic structure modeling, and electrochemical performance evaluation of novel 2D carbon allotropes (THD-C, CKL, Orth-C14) and functional heterostructures for metal-ion battery anodes."
    projects:
      - title: "2D Carbon Allotropes for Li-Ion Battery Anodes"
        slug: "2d-carbon-anodes"
      - title: "Cooperative Cation-pi Interaction Kinetics"
        slug: "cation-pi-kinetics"
    domains:
      - "2D Materials"
      - "Metal-Ion Batteries"
      - "DFT Calculations"
      - "Anode Materials"

  - id: "02"
    name: "Excited-State Carrier Dynamics"
    image: "research/carrier_dynamics.png"
    description: "Quantum simulation and ultrafast non-adiabatic dynamics of excited-state carriers and electron-hole pairs in novel low-dimensional functional materials and heterostructures."
    projects:
      - title: "Carrier Transport in 2D Heterostructures"
        slug: "carrier-transport"
      - title: "Ultrafast Photodynamic Processes"
        slug: "ultrafast-photodynamics"
    domains:
      - "Excited States"
      - "Carrier Dynamics"
      - "Heterostructures"
      - "Optoelectronics"

  - id: "03"
    name: "Novel Clean Energy & Hydrogen Storage"
    image: "research/hydrogen_storage.png"
    description: "First-principles evaluation, structural stability screening, and physicochemical property characterization of advanced clean energy systems, with a strong focus on high-capacity hydrogen storage."
    projects:
      - title: "Theoretical Screening for Hydrogen Storage"
        slug: "hydrogen-storage-screening"
      - title: "Gas Sensing and Adsorption Mechanisms"
        slug: "gas-sensing-adsorption"
    domains:
      - "Hydrogen Storage"
      - "Gas Adsorption"
      - "Clean Energy"
      - "First-Principles"

  - id: "04"
    name: "Smart Controllable Energetic Materials"
    image: "research/energetic_materials.png"
    description: "Rational molecular engineering, thermodynamic sensitivity modeling, and decomposition/initiation reaction pathways of smart controllable energetic compounds."
    projects:
      - title: "Energetic Crystal Structure Modeling"
        slug: "energetic-structure-modeling"
      - title: "Initiation Behaviors & Thermal Reaction Pathways"
        slug: "initiation-reaction-pathways"
    domains:
      - "Energetic Materials"
      - "Reaction Kinetics"
      - "Structure Design"
      - "Thermodynamics"

  - id: "05"
    name: "AI4S & Data-Driven Energy Materials Discovery"
    image: "research/ai4s_materials.png"
    description: "Developing physics-informed machine learning workflows and data-driven computational paradigms to accelerate high-throughput screening, property prediction, and novel candidate discovery for advanced battery anode materials."
    projects:
      - title: "High-Throughput AI Screening for Battery Anodes"
        slug: "ai-screening-battery-anodes"
      - title: "Data-Driven Material Property Prediction Workflows"
        slug: "data-driven-property-prediction"
    domains:
      - "AI4S"
      - "Machine Learning"
      - "High-Throughput Screening"
      - "Materials Informatics"